[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mirage-deception"
version = "0.1.0"
description = "Active cyber deception, service impersonation, containment, and threat intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
authors = [{ name = "MIRAGE contributors" }]
dependencies = []

[project.scripts]
mirage = "mirage.cli:main"
mirage-checkpoint-server = "mirage.telemetry.checkpoint_service:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "asyncssh>=2.20,<3"]
ssh = ["asyncssh>=2.20,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
